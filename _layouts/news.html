---
layout: default
---
<div class="text-center mt-20 mb-4">
  <h2>NEWS</h2>
</div>
<h2 class="text-4xl text-center mb-2">
  {{ page.title }}
</h2>
<p class="text-center">
  <time>{{ page.date | date:"%Y.%-m.%-d" }}</time>
</p>

<div class="max-w-7xl mx-auto px-8 post-content my-8">
  {{ content | markdownify }}
</div>

<div class="w-3xl mx-auto">
  {% include button.html href="/news" label="お知らせ一覧にもどる" %}
</div>
