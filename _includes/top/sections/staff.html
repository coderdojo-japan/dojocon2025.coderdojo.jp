<h2 class="text-4xl text-center">
  実行員紹介
  <span class="block mt-5 text-2xl">STAFF</span>
</h2>
<div class="max-w-7xl mx-auto mt-9 mb-40">
  <ul class="flex flex-col flex-wrap justify-center gap-x-32">
    {% for i in (1..3) %}
    <div class="flex justify-center">
      {% for j in (1..4) %}
      <li>
        <div class="aspect-[1/cos(30deg)] w-50 overflow-hidden flex items-center justify-center"
          style="clip-path: polygon(50% -50%,100% 50%,50% 150%,0 50%);">
          <img class="w-full" src="https://placehold.jp/320x320.png" alt="スタッフの写真">
        </div>
      </li>
      {% endfor %}
    </div>
    <div class="flex justify-center">
      {% for j in (1..3) %}
      <li>
        <div class="aspect-[1/cos(30deg)] w-50 -mt-18 overflow-hidden flex items-center justify-center"
          style="clip-path: polygon(50% -50%,100% 50%,50% 150%,0 50%);">
          <img class="w-full" src="https://placehold.jp/320x320.png" alt="スタッフの写真">
        </div>
      </li>
      {% endfor %}
    </div>
    {% endfor %}
  </ul>
</div>
